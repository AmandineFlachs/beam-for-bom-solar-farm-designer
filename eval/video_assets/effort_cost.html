<!DOCTYPE html>
<!-- Effort vs cost — Financial design system. 1920x1080. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#07090e; color:#f4f5f7;
    font-family:'IBM Plex Sans',sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }
  .kick { font-family:'IBM Plex Mono',monospace; font-size:16px;
    letter-spacing:.3em; color:#ff951f; text-transform:uppercase;
    margin-bottom:18px; animation:fadein .16s both; }
  .title { font-size:50px; font-weight:500; letter-spacing:-.01em;
    margin-bottom:64px; animation:fadein .16s .15s both; }
  .title em { color:#edcd8c; font-style:normal; }
  .chart { display:flex; align-items:flex-end; gap:170px; height:450px;
    border-bottom:1px solid #303139; padding:0 50px; }
  .col { display:flex; flex-direction:column; align-items:center;
    justify-content:flex-end; height:100%; }
  .bars { display:flex; align-items:flex-end; gap:12px; }
  .bar { width:80px; position:relative; animation:grow .5s ease both;
    transform-origin:bottom; }
  .bar .v { position:absolute; top:-40px; left:0; right:0; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:500; }
  .correct { background:#101522; border:1px solid #303139; }
  .correct .v { color:#c9ced8; }
  .tok { background:#1c1508; border:1px solid #ff951f; }
  .tok .v { color:#edcd8c; }
  .lbl { margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:17px;
    color:#c9ced8; letter-spacing:.25em; text-transform:uppercase;
    animation:fadein .16s both; }
  .c1 .bar,.c1 .lbl { animation-delay:.4s } .c2 .bar,.c2 .lbl { animation-delay:.7s }
  .c3 .bar,.c3 .lbl { animation-delay:1.0s }
  .note { margin-top:50px; font-size:23px; color:#c9ced8;
    animation:fadein .16s 1.3s both; }
  .note b { color:#f4f5f7; font-weight:500; }
  .legend { display:flex; gap:40px; margin-top:24px;
    font-family:'IBM Plex Mono',monospace; font-size:15px; color:#c9ced8;
    letter-spacing:.1em; animation:fadein .16s 1.1s both; }
  .legend span::before { content:''; display:inline-block; width:14px;
    height:14px; margin-right:10px; vertical-align:-1px; border-radius:2px; }
  .legend .lc::before { background:#101522; border:1px solid #303139; }
  .legend .lt::before { background:#1c1508; border:1px solid #ff951f; }
  @keyframes grow { from { transform:scaleY(0) } to { transform:scaleY(1) } }
  @keyframes fadein { from { opacity:0; transform:translateY(10px) } to { opacity:1 } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important } }
</style></head><body>
  <div class="kick">Effort vs cost · 66 runs</div>
  <div class="title">More effort, <em>same correctness.</em></div>
  <div class="chart">
    <div class="col c1"><div class="bars">
      <div class="bar correct" style="height:400px"><div class="v">16/22</div></div>
      <div class="bar tok" style="height:190px"><div class="v">602</div></div>
    </div><div class="lbl">low</div></div>
    <div class="col c2"><div class="bars">
      <div class="bar correct" style="height:400px"><div class="v">16/22</div></div>
      <div class="bar tok" style="height:290px"><div class="v">919</div></div>
    </div><div class="lbl">medium</div></div>
    <div class="col c3"><div class="bars">
      <div class="bar correct" style="height:400px"><div class="v">15/22</div></div>
      <div class="bar tok" style="height:400px"><div class="v">1,279</div></div>
    </div><div class="lbl">high</div></div>
  </div>
  <div class="legend"><span class="lc">TASKS PASSED</span><span class="lt">AVG OUTPUT TOKENS</span></div>
  <div class="note">Tool selection is <b>saturated at low effort</b>. High effort costs 2.1× the tokens.</div>
</body></html>
